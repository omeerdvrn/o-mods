name: Bug in a mod
description: A mod does something wrong or doesn't load
labels: [bug]
body:
  - type: input
    id: mod
    attributes:
      label: Mod
      placeholder: heat
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [Terminal, Desktop app, Both]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
