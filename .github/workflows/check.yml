name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Registry, marketplace and README agree; no secrets
        run: node scripts/check-registry.mjs
      - name: Site builds
        working-directory: site
        run: |
          npm ci
          npm run build
