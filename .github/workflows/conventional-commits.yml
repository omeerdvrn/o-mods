name: Conventional commits

# Every commit in a pull request, and the pull request's title, follow
# Conventional Commits: type(scope): subject. See CONTRIBUTING.md.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Title and commit subjects follow type(scope): subject"
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^A-Z].{0,70}$'
          bad=0
          check() {
            if printf '%s' "$2" | grep -Eq "$pattern"; then
              echo "ok    $1: $2"
            else
              echo "::error::$1 is not a conventional commit: \"$2\". Use type(scope): subject, e.g. \"feat(heat): add a cooldown option\" (types: feat fix docs style refactor perf test build ci chore revert; lowercase subject, 72 characters at most)."
              bad=1
            fi
          }
          check "PR title" "$TITLE"
          while IFS= read -r line; do
            check "commit ${line%% *}" "${line#* }"
          done < <(git log --no-merges --format='%h %s' "$BASE..$HEAD")
          exit $bad
