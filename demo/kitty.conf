# kitty for recording demos of mods that draw pictures: Claude Code draws them
# with kitty's Unicode placeholders, which VHS's terminal cannot show. The same
# look as demo/style.tape; demo/kitty-tape.mjs sets the size.
font_family JetBrainsMono NFM
font_size 14
remember_window_size no
hide_window_decorations yes
window_padding_width 18
confirm_os_window_close 0
enable_audio_bell no
macos_quit_when_last_window_closed yes
cursor_shape block
cursor_blink_interval 0
update_check_interval 0
foreground #e8e0d6
background #1a1714
cursor #d97757
selection_background #3a342e
color0 #1a1714
color1 #e5786d
color2 #9ccc8c
color3 #e5c07b
color4 #7aa2f7
color5 #c49bd9
color6 #7fc8c8
color7 #e8e0d6
color8 #6b635b
color9 #f08a7f
color10 #b5dea5
color11 #f0d394
color12 #94b6ff
color13 #d6b0e8
color14 #9adada
color15 #ffffff
